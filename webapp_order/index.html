<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Заказ бота</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(-45deg, #0f2027, #203a43, #2c5364, #1e130c);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        .container {
            width: 100%; max-width: 400px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 24px; border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        h2 { margin-top: 0; text-align: center; font-size: 24px; font-weight: 600; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
        label { display: block; font-size: 14px; margin-bottom: 5px; opacity: 0.8; }
        input, select, textarea {
            width: 100%; padding: 14px; margin-bottom: 16px;
            border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 12px;
            background-color: rgba(0, 0, 0, 0.2); color: #ffffff;
            font-size: 16px; box-sizing: border-box; outline: none;
            transition: all 0.3s ease; appearance: none;
            font-family: inherit;
        }
        textarea { resize: vertical; min-height: 80px; }
        input:focus, select:focus, textarea:focus { border-color: rgba(255, 255, 255, 0.8); background-color: rgba(0, 0, 0, 0.4); box-shadow: 0 0 10px rgba(255,255,255,0.1); }
        button {
            width: 100%; padding: 16px; background: linear-gradient(135deg, #00c6ff, #0072ff);
            color: #ffffff; border: none; border-radius: 12px; font-size: 18px; font-weight: bold;
            cursor: pointer; box-shadow: 0 4px 15px rgba(0, 114, 255, 0.4);
            transition: transform 0.1s, box-shadow 0.1s; margin-top: 10px;
        }
        button:active { transform: scale(0.96); box-shadow: 0 2px 8px rgba(0, 114, 255, 0.4); }
        .error { color: #ff4d4d; font-size: 14px; margin-bottom: 10px; text-align: center; display: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Заказать бота</h2>
        <div class="error" id="error-msg">Заполните все поля!</div>
        
        <label>Ваше имя</label>
        <input type="text" id="name" placeholder="Как к вам обращаться?" required>
        
        <label>Контакт для связи</label>
        <input type="tel" id="phone" placeholder="Телефон или @username" required>
        
        <label>Тип бота</label>
        <select id="bot_type">
            <option value="Бот для сбора заявок">Сбор заявок (Мини-CRM)</option>
            <option value="Бот с Web App">Бот с Web App (Mini App)</option>
            <option value="Интернет-магазин">Магазин / Каталог товаров</option>
            <option value="Другой">Другой (описание ниже)</option>
        </select>

        <label>Опишите задачу</label>
        <textarea id="description" placeholder="Какие функции нужны боту?"></textarea>
        
        <button onclick="sendData()">Отправить заявку</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        function sendData() {
            const name = document.getElementById('name').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const botType = document.getElementById('bot_type').value;
            const desc = document.getElementById('description').value.trim();
            const errorDiv = document.getElementById('error-msg');

            if (name.length < 2 || phone.length < 5) {
                errorDiv.style.display = 'block';
                return;
            }

            const data = {
                name: name,
                phone: phone,
                bot_type: botType,
                description: desc
            };

            tg.sendData(JSON.stringify(data));
            setTimeout(() => { tg.close(); }, 300);
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Space Clicker</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: var(--tg-theme-bg-color, #0f0c29);
            --text: var(--tg-theme-text-color, #ffffff);
            --btn: linear-gradient(135deg, #ff00cc, #333399);
        }

        /* Убираем подсветку при нажатии на мобильных устройствах */
        * {
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            background: linear-gradient(to bottom, #0f0c29, #302b63, #24243e);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        .score-container {
            text-align: center;
            margin-bottom: 30px;
            z-index: 10;
        }

        .score-title {
            font-size: 16px;
            color: #e0e0e0; /* Светлый цвет */
            opacity: 1;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5); /* Легкое свечение */
        }

        .score {
            font-size: 56px;
            font-weight: 900;
            background: -webkit-linear-gradient(#00c6ff, #0072ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0, 198, 255, 0.3);
            transition: transform 0.1s;
        }

        .coin-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .coin {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #ffffff, #00c6ff 20%, #0072ff 80%);
            box-shadow: 0 0 50px rgba(0, 198, 255, 0.6), inset 0 10px 20px rgba(255,255,255,0.5), inset 0 -10px 20px rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 80px;
            cursor: pointer;
            transition: transform 0.05s ease;
            outline: none; /* Убираем рамку */
            -webkit-user-select: none;
        }

        .coin:active {
            transform: scale(0.92);
        }

        .floating-text {
            position: absolute;
            font-size: 24px;
            font-weight: bold;
            color: #fff;
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
            text-shadow: 0 0 10px #00c6ff;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-100px) scale(1.5); }
        }

        .btn-claim {
            margin-top: 40px;
            width: 80%;
            max-width: 300px;
            padding: 16px;
            background: var(--btn);
            color: #fff;
            border: none;
            border-radius: 50px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 0, 204, 0.4);
            transition: transform 0.1s, opacity 0.3s;
            outline: none; /* Убираем рамку */
        }

        .btn-claim:active {
            transform: scale(0.95);
        }

        /* Звезды на фоне */
        .stars {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #eee, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 40px 70px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 50px 160px, #ddd, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 90px 40px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 130px 80px, #fff, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 200px 200px;
            animation: sparkle 5s infinite linear;
        }

        @keyframes sparkle {
            from { transform: translateY(0); }
            to { transform: translateY(-200px); }
        }

        /* Стили для частиц фейерверка */
        .particle {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 100;
            box-shadow: 0 0 10px currentColor;
        }
    </style>
</head>
<body>

    <div class="stars"></div>

    <div class="score-container">
        <div class="score-title">Ваши монеты</div>
        <div class="score" id="score">0</div>
    </div>

    <div class="coin-wrapper" id="coin-wrapper">
        <div class="coin" id="coin" onclick="tap(event)">💰</div>
    </div>

    <button class="btn-claim" id="btn-claim" onclick="claim()">Забрать награду</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        let score = 0;
        const scoreEl = document.getElementById('score');
        const coinWrapper = document.getElementById('coin-wrapper');
        const btnClaim = document.getElementById('btn-claim');

        function tap(event) {
            score++;
            scoreEl.innerText = score;
            
            // Анимация пульсации цифры
            scoreEl.style.transform = "scale(1.1)";
            setTimeout(() => scoreEl.style.transform = "scale(1)", 100);

            // Вибрация
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('light');
            }

            // Всплывающий текст "+1"
            const floatText = document.createElement('div');
            floatText.className = 'floating-text';
            floatText.innerText = '+1';
            
            const rect = coinWrapper.getBoundingClientRect();
            // Поддержка мыши и тачскрина
            const clientX = event.clientX || (event.touches && event.touches[0].clientX) || rect.left + rect.width/2;
            const clientY = event.clientY || (event.touches && event.touches[0].clientY) || rect.top + rect.height/2;
            
            floatText.style.left = (clientX - rect.left - 10) + 'px';
            floatText.style.top = (clientY - rect.top - 10) + 'px';
            
            coinWrapper.appendChild(floatText);

            setTimeout(() => floatText.remove(), 800);
        }

        function claim() {
            if (score === 0) {
                tg.showAlert("Сначала нажмите на монету!");
                return;
            }

            // Меняем кнопку и блокируем её
            btnClaim.innerText = "Отправка...";
            btnClaim.style.opacity = "0.7";
            btnClaim.disabled = true;

            // Запускаем фейерверк
            createFireworks();

            // Ждем 2 секунды (чтобы игрок насладился фейерверком), затем отправляем и закрываем
            setTimeout(() => {
                tg.sendData(JSON.stringify({ score: score }));
                tg.close();
            }, 2000);
        }

        // Функция для создания искр
        function createFireworks() {
            const colors = ['#ff00cc', '#00c6ff', '#ffcc00', '#00ffcc', '#ff3333'];
            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;

            for(let i = 0; i < 60; i++) {
                let particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = centerX + 'px';
                particle.style.top = centerY + 'px';
                
                const color = colors[Math.floor(Math.random() * colors.length)];
                particle.style.backgroundColor = color;
                particle.style.color = color; // Для box-shadow
                
                document.body.appendChild(particle);

                // Рандомный разлет
                const angle = Math.random() * Math.PI * 2;
                const velocity = 50 + Math.random() * 150;
                const x = Math.cos(angle) * velocity;
                const y = Math.sin(angle) * velocity;

                // Анимация через Web Animations API
                const animation = particle.animate([
                    { transform: 'translate(-50%, -50%) scale(1)', opacity: 1 },
                    { transform: `translate(calc(-50% + ${x}px), calc(-50% + ${y}px)) scale(0)`, opacity: 0 }
                ], {
                    duration: 1000 + Math.random() * 1000,
                    easing: 'cubic-bezier(0, .9, .57, 1)'
                });

                animation.onfinish = () => particle.remove();
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Book / Запись</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(-45deg, #1e130c, #9a8478, #2b5876, #4e4376);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        .container {
            width: 100%; max-width: 400px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 24px; border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        h2 { margin-top: 0; text-align: center; font-size: 24px; font-weight: 600; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
        label { display: block; font-size: 14px; margin-bottom: 5px; opacity: 0.8; }
        input, select {
            width: 100%; padding: 14px; margin-bottom: 16px;
            border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 12px;
            background-color: rgba(0, 0, 0, 0.2); color: #ffffff;
            font-size: 16px; box-sizing: border-box; outline: none;
            transition: all 0.3s ease; appearance: none;
        }
        input:focus, select:focus { border-color: rgba(255, 255, 255, 0.8); background-color: rgba(0, 0, 0, 0.4); box-shadow: 0 0 10px rgba(255,255,255,0.1); }
        ::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }
        button {
            width: 100%; padding: 16px; background: linear-gradient(135deg, #00c6ff, #0072ff);
            color: #ffffff; border: none; border-radius: 12px; font-size: 18px; font-weight: bold;
            cursor: pointer; box-shadow: 0 4px 15px rgba(0, 114, 255, 0.4);
            transition: transform 0.1s, box-shadow 0.1s; margin-top: 10px;
        }
        button:active { transform: scale(0.96); box-shadow: 0 2px 8px rgba(0, 114, 255, 0.4); }
        .error { color: #ff4d4d; font-size: 14px; margin-bottom: 10px; text-align: center; display: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h2 id="title">Онлайн-запись</h2>
        <div class="error" id="error-msg">Заполните все поля!</div>
        
        <label id="lbl-name">Ваше имя</label>
        <input type="text" id="name" placeholder="Введите имя" autocomplete="off" required>
        
        <label id="lbl-phone">Телефон</label>
        <!-- ЗАЩИТА ОТ АВТОЗАПОЛНЕНИЯ -->
        <input type="text" inputmode="tel" id="phone" placeholder="+7 (999) 000-00-00" autocomplete="off" required>
        
        <label id="lbl-service">Услуга</label>
        <select id="service">
            <option value="Консультация" id="opt-1">Консультация</option>
            <option value="Стрижка" id="opt-2">Стрижка / Услуга</option>
            <option value="Разработка бота" id="opt-3">Разработка бота</option>
        </select>

        <label id="lbl-date">Дата</label>
        <input type="date" id="date" required>

        <label id="lbl-time">Время</label>
        <input type="time" id="time" required>
        
        <button id="btn-submit" onclick="sendData()">Записаться</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        const lang = tg.initDataUnsafe?.user?.language_code || 'ru';
        const isEn = lang.startsWith('en');

        const translations = {
            ru: { title: "Онлайн-запись", err: "Заполните все поля!", lblName: "Ваше имя", lblPhone: "Телефон", lblService: "Услуга", lblDate: "Дата", lblTime: "Время", btn: "Записаться", opt1: "Консультация", opt2: "Стрижка / Услуга", opt3: "Разработка бота" },
            en: { title: "Online Booking", err: "Please fill all fields!", lblName: "Your Name", lblPhone: "Phone", lblService: "Service", lblDate: "Date", lblTime: "Time", btn: "Book Now", opt1: "Consultation", opt2: "Haircut / Service", opt3: "Bot Development" }
        };

        if (isEn) {
            const t = translations.en;
            document.getElementById('title').innerText = t.title;
            document.getElementById('error-msg').innerText = t.err;
            document.getElementById('lbl-name').innerText = t.lblName;
            document.getElementById('lbl-phone').innerText = t.lblPhone;
            document.getElementById('lbl-service').innerText = t.lblService;
            document.getElementById('lbl-date').innerText = t.lblDate;
            document.getElementById('lbl-time').innerText = t.lblTime;
            document.getElementById('btn-submit').innerText = t.btn;
            document.getElementById('opt-1').innerText = t.opt1;
            document.getElementById('opt-2').innerText = t.opt2;
            document.getElementById('opt-3').innerText = t.opt3;
            document.documentElement.lang = "en";
        }

        const today = new Date().toISOString().split('T')[0];
        document.getElementById('date').min = today;

        function sendData() {
            const name = document.getElementById('name').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const service = document.getElementById('service').value;
            const date = document.getElementById('date').value;
            const time = document.getElementById('time').value;
            const errorDiv = document.getElementById('error-msg');

            if (name.length < 2 || phone.length < 5 || !date || !time) {
                errorDiv.style.display = 'block';
                return;
            }

            let finalService = service;
            if (isEn) {
                if (service === "Консультация") finalService = "Consultation";
                else if (service === "Стрижка") finalService = "Haircut / Service";
                else if (service === "Разработка бота") finalService = "Bot Development";
            }

            const data = { name: name, phone: phone, service: finalService, date: date, time: time };
            tg.sendData(JSON.stringify(data));
            setTimeout(() => { tg.close(); }, 300);
        }
    </script>
</body>
</html>
